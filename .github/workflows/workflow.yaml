name: Go

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        run: make lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26', '1.27']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Go < 1.24 does not emit the LC_UUID load command in Mach-O
          # binaries, which the macOS 26 (macos-latest) dyld refuses to
          # load ("missing LC_UUID load command"). Old Go versions are
          # still covered on Linux and Windows.
          - os: macos-latest
            go-version: '1.20'
          - os: macos-latest
            go-version: '1.21'
          - os: macos-latest
            go-version: '1.22'
          - os: macos-latest
            go-version: '1.23'
    env:
      OS: ${{ matrix.os }}
      GOVERSION: ${{ matrix.go-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Display Go version
        run: go version

      - name: Install dependencies
        run: make setup

      - name: Test
        run: make ci

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27' && github.actor != 'app/dependabot' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittest
          fail_ci_if_error: true
